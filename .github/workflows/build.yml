name: Build Mod
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create Perfect Fabric Project Structures
        run: |
          mkdir -p src/main/java/com/example/fastminecart/mixin
          mkdir -p src/main/resources

          # 1. 寫入 gradle.properties
          cat << 'EOF' > gradle.properties
          minecraft_version=1.21.1
          yarn_mappings=1.21.1+build.3
          loader_version=0.16.9
          fabric_version=0.107.0+1.21.1
          loom_version=1.9.2
          mod_version=1.0.0
          maven_group=com.example
          archives_base_name=fastminecart
          EOF

          # 2. 寫入傳統標準無等號語法的 settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  maven { url "https://maven.fabricmc.net/" }
                  maven { url "https://apache.org" }
                  mavenCentral()
              }
          }
          plugins {
              id "net.fabricmc.loom" version "${loom_version}"
          }
          EOF

          # 3. 寫入 build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'fabric-loom' version "${loom_version}"
          }
          version = project.mod_version
          group = project.maven_group
          base { archivesName = project.archives_base_name }
          repositories { mavenCentral() }
          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }
          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") { expand "version": project.version }
          }
          tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
          EOF

          # 4. 寫入 fabric.mod.json
          cat << 'EOF' > src/main/resources/fabric.mod.json
          {
            "schemaVersion": 1,
            "id": "fastminecart",
            "version": "1.0.0",
            "name": "Fast Minecart",
            "description": "突破礦車速度上限！",
            "authors": ["AI"],
            "contact": {},
            "license": "MIT",
            "environment": "*",
            "entrypoints": {},
            "mixins": ["fastminecart.mixins.json"],
            "depends": {
              "fabricloader": ">=0.16.0",
              "minecraft": "~1.21.1",
              "java": ">=21"
            }
          }
          EOF

          # 5. 寫入 fastminecart.mixins.json
          cat << 'EOF' > src/main/resources/fastminecart.mixins.json
          {
            "required": true,
            "package": "com.example.fastminecart.mixin",
            "compatibilityLevel": "JAVA_21",
            "mixins": ["AbstractMinecartEntityMixin"],
            "injectors": { "defaultRequire": 1 }
          }
          EOF

          # 6. 寫入突破礦車速度的 Java 核心程式碼
          cat << 'EOF' > src/main/java/com/example/fastminecart/mixin/AbstractMinecartEntityMixin.java
          package com.example.fastminecart.mixin;
          import net.minecraft.world.entity.vehicle.AbstractMinecart;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfoReturnable;
          @Mixin(AbstractMinecart.class)
          public class AbstractMinecartEntityMixin {
              @Inject(method = "getMaxSpeed", at = @At("HEAD"), cancellable = true)
              private void onGetMaxSpeed(CallbackInfoReturnable<Double> cir) {
                  cir.setReturnValue(20.0);
              }
          }
          EOF

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle Toolkit
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Mod with Built-in Gradle
        run: gradle build --no-daemon

      - name: Upload Finished Jar Mod
        uses: actions/upload-artifact@v4
        with:
          name: FastMinecart-Mod-Finished
          path: build/libs/*.jar
