name: Build Mod
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Perfect Project Files
        run: |
          # 建立原始碼與設定檔專用資料夾
          mkdir -p src/main/java/com/example/fastminecart/mixin
          mkdir -p src/main/resources

          # 1. 現場直接寫出獨立的 settings.gradle 檔案
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  maven { url "https://maven.fabricmc.net/" }
                  maven { url "https://gradle.org" }
                  mavenCentral()
              }
          }
          plugins {
              id "net.fabricmc.loom" version "1.9.2"
          }
          EOF

          # 2. 現場直接寫出獨立的 build.gradle 檔案
          cat << 'EOF' > build.gradle
          plugins {
              id 'fabric-loom'
          }
          version = "1.0.0"
          group = "com.example"
          base { archivesName = "fastminecart" }
          repositories { 
              mavenCentral() 
          }
          dependencies {
              minecraft "com.mojang:minecraft:1.21.1"
              mappings "net.fabricmc:yarn:1.21.1+build.3:v2"
              modImplementation "net.fabricmc:fabric-loader:0.16.9"
              modImplementation "net.fabricmc.fabric-api:fabric-api:0.107.0+1.21.1"
          }
          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") { expand "version": project.version }
          }
          tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
          EOF

          # 3. 現場寫入 fabric.mod.json
          cat << 'EOF' > src/main/resources/fabric.mod.json
          {
            "schemaVersion": 1,
            "id": "fastminecart",
            "version": "1.0.0",
            "name": "Fast Minecart",
            "description": "突破礦車速度上限！",
            "authors": ["AI"],
            "contact": {},
            "license": "MIT",
            "environment": "*",
            "entrypoints": {},
            "mixins": ["fastminecart.mixins.json"],
            "depends": {
              "fabricloader": ">=0.16.0",
              "minecraft": "~1.21.1",
              "java": ">=21"
            }
          }
          EOF

          # 4. 現場寫入 fastminecart.mixins.json
          cat << 'EOF' > src/main/resources/fastminecart.mixins.json
          {
            "required": true,
            "package": "com.example.fastminecart.mixin",
            "compatibilityLevel": "JAVA_21",
            "mixins": ["AbstractMinecartEntityMixin"],
            "injectors": { "defaultRequire": 1 }
          }
          EOF

          # 5. 現場寫入突破礦車速度的 Java 核心程式碼
          cat << 'EOF' > src/main/java/com/example/fastminecart/mixin/AbstractMinecartEntityMixin.java
          package com.example.fastminecart.mixin;
          import net.minecraft.world.entity.vehicle.AbstractMinecart;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfoReturnable;
          @Mixin(AbstractMinecart.class)
          public class AbstractMinecartEntityMixin {
              @Inject(method = "getMaxSpeed", at = @At("HEAD"), cancellable = true)
              private void onGetMaxSpeed(CallbackInfoReturnable<Double> cir) {
                  // 強行覆寫為 20.0（每秒 400 格的瘋狂速度）
                  cir.setReturnValue(20.0);
              }
          }
          EOF

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle Toolkit
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Mod with Built-in Gradle
        run: gradle build --no-daemon

      - name: Upload Finished Jar Mod
        uses: actions/upload-artifact@v4
        with:
          name: FastMinecart-Mod-Finished
          path: build/libs/*.jar
