name: Build Mod
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download Perfect Fabric Template
        run: |
          # 下載官方最新的標準範本並解壓
          curl -L https://github.com -o template.zip
          unzip template.zip
          mv fabric-example-mod-1.21/* .
          
          # 清理預設名稱並修改為 fastminecart
          sed -i 's/"modid"/"fastminecart"/g' src/main/resources/fabric.mod.json
          sed -i 's/"Example Mod"/"Fast Minecart"/g' src/main/resources/fabric.mod.json
          sed -i 's/"modid.mixins.json"/"fastminecart.mixins.json"/g' src/main/resources/fabric.mod.json
          
          # 重新命名並重寫 mixin json 設定
          mv src/main/resources/modid.mixins.json src/main/resources/fastminecart.mixins.json
          cat << 'EOF' > src/main/resources/fastminecart.mixins.json
          {
            "required": true,
            "package": "com.example.fastminecart.mixin",
            "compatibilityLevel": "JAVA_21",
            "mixins": [
              "AbstractMinecartEntityMixin"
            ],
            "injectors": {
              "defaultRequire": 1
            }
          }
          EOF
          
          # 清理多餘資料夾，建立正確的 java 結構
          rm -rf src/main/java/net
          mkdir -p src/main/java/com/example/fastminecart/mixin
          
          # 寫入突破礦車速度上限的核心程式碼
          cat << 'EOF' > src/main/java/com/example/fastminecart/mixin/AbstractMinecartEntityMixin.java
          package com.example.fastminecart.mixin;

          import net.minecraft.world.entity.vehicle.AbstractMinecart;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfoReturnable;

          @Mixin(AbstractMinecart.class)
          public class AbstractMinecartEntityMixin {
              @Inject(method = "getMaxSpeed", at = @At("HEAD"), cancellable = true)
              private void onGetMaxSpeed(CallbackInfoReturnable<Double> cir) {
                  // 強行覆寫最大速度為每刻 20.0 格（每秒 400 格，比原本快 50 倍！）
                  cir.setReturnValue(20.0); 
              }
          }
          EOF

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Mod with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Upload Finished Jar Mod
        uses: actions/upload-artifact@v4
        with:
          name: FastMinecart-Mod-Finished
          path: build/libs/*.jar
